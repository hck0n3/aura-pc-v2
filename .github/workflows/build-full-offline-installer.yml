name: Full offline Windows installer

# Builds a self-contained NSIS installer for a freshly formatted Windows PC:
#   - libmpv-2.dll (117 MB) next to the exe
#   - the VC++ runtime DLLs used by the karaoke runtime
#   - the WebView2 offline installer embedded in the setup (no internet needed)
#
# Triggered by pushing to build/full-offline-installer. The resulting setup.exe is uploaded as a
# workflow artifact; nothing is attached to a GitHub release and no signing key is required.

on:
  push:
    branches:
      - build/full-offline-installer
  workflow_dispatch:

permissions:
  contents: read

env:
  MPV_DEV_ASSET: libmpv-2-x86_64-20260610-git-304426c.7z
  MPV_DEV_SHA256: af708edcdf6ed12ac7b2bb31b4cbeba0bf7d4eef345a715ef5de782c0ddd6671
  MPV_DIR: ${{ github.workspace }}\.libmpv

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Frontend deps
        shell: bash
        run: cd ui && pnpm install --frozen-lockfile

      - name: Rust (MSVC)
        shell: bash
        run: rustup default stable-msvc

      - name: Resolve RUSTFLAGS (linker + libmpv link path)
        shell: bash
        run: |
          set -euo pipefail
          FLAGS="-L native=${{ github.workspace }}\.libmpv"
          SYSROOT="$(rustc --print sysroot | tr '\\' '/')"
          RUST_LLD="$SYSROOT/lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
          if [ -f "$RUST_LLD" ]; then
            FLAGS="$FLAGS -C linker-flavor=lld-link -C linker=$RUST_LLD"
            echo "linking with rust-lld ($RUST_LLD)"
          else
            echo "::warning::rust-lld not found at $RUST_LLD, falling back to MSVC link.exe"
          fi
          echo "RUSTFLAGS=$FLAGS" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=$FLAGS"

      - name: Tauri CLI
        shell: bash
        run: npm install -g "@tauri-apps/cli@2.11.5"

      - name: Build the libmpv import library
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:MPV_DIR" | Out-Null
          gh release download deps --repo "$env:GITHUB_REPOSITORY" --pattern "$env:MPV_DEV_ASSET" --output "$env:MPV_DIR\mpv-dev.7z" --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not download $env:MPV_DEV_ASSET from the deps release" }
          if ((Get-FileHash "$env:MPV_DIR\mpv-dev.7z" -Algorithm SHA256).Hash -ne $env:MPV_DEV_SHA256) { throw "mpv-dev.7z does not match MPV_DEV_SHA256" }
          7z x "$env:MPV_DIR\mpv-dev.7z" -o"$env:MPV_DIR" -y | Out-Null
          if (-not (Test-Path "$env:MPV_DIR\libmpv-2.dll")) { throw "libmpv-2.dll not found in the dev package" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          Set-Location "$env:MPV_DIR"
          $names = & dumpbin /exports libmpv-2.dll |
            Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($names.Count -lt 50) { throw "parsed only $($names.Count) exports from libmpv-2.dll" }
          @("EXPORTS") + ($names | ForEach-Object { "    $_" }) | Set-Content -Path mpv.def -Encoding ascii
          & lib /def:mpv.def /name:libmpv-2.dll /out:mpv.lib /machine:x64
          if (-not (Test-Path "$env:MPV_DIR\mpv.lib")) { throw "lib.exe did not produce mpv.lib" }

          $system = @('ADVAPI32.dll', 'AVICAP32.dll', 'AVRT.dll', 'bcrypt.dll', 'bcryptprimitives.dll',
            'CFGMGR32.dll', 'CRYPT32.dll', 'd2d1.dll', 'dwmapi.dll', 'DWrite.dll', 'GDI32.dll', 'IMM32.dll',
            'IPHLPAPI.DLL', 'KERNEL32.dll', 'Normaliz.dll', 'ntdll.dll', 'ole32.dll', 'OLEAUT32.dll',
            'OPENGL32.dll', 'Secur32.dll', 'SETUPAPI.dll', 'SHCORE.dll', 'SHELL32.dll', 'SHLWAPI.dll',
            'USER32.dll', 'UxTheme.dll', 'VERSION.dll', 'WINMM.dll', 'WLDAP32.dll', 'WS2_32.dll')
          $imports = & dumpbin /dependents libmpv-2.dll |
            Select-String -Pattern '^\s+(\S+\.dll)\s*$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($imports.Count -lt 10) { throw "parsed only $($imports.Count) imports from libmpv-2.dll" }
          $foreign = $imports | Where-Object { $_ -notlike 'api-ms-win-*' -and $system -notcontains $_ }
          if ($foreign) { throw "libmpv-2.dll imports DLLs that are not part of Windows: $($foreign -join ', ')" }
          Write-Host "libmpv-2.dll imports $($imports.Count) DLLs, all part of Windows"
          Write-Host "mpv.lib built from $($names.Count) exports"

          Copy-Item "$env:MPV_DIR\libmpv-2.dll" "$env:GITHUB_WORKSPACE\src-tauri\libmpv-2.dll" -Force

      - name: VC++ runtime (bundled)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio not found" }
          $msvc = Join-Path $vs "VC\Redist\MSVC"
          $defaultTxt = Join-Path $vs "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          if (Test-Path $defaultTxt) {
              $redistVersion = (Get-Content -Raw $defaultTxt).Trim()
          } else {
              $redistVersion = (Get-ChildItem -Path $msvc -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
              if (-not $redistVersion) { throw "no MSVC redist version found in $msvc" }
          }
          $x64Folder = Join-Path $msvc "$redistVersion\x64"
          $crt = Get-ChildItem -Directory -Path $x64Folder -Filter 'Microsoft.VC*.CRT' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $crt) { throw "no CRT folder matching Microsoft.VC*.CRT found in $x64Folder" }
          $crtDir = $crt.FullName

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\src-tauri\vcruntime" | Out-Null
          foreach ($dll in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll')) {
              $src = Join-Path $crtDir $dll
              if (-not (Test-Path $src)) { throw "missing $dll in $crtDir" }
              Copy-Item $src -Destination "$env:GITHUB_WORKSPACE\src-tauri\vcruntime\$dll" -Force
          }
          foreach ($dll in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll')) {
              $dest = Join-Path "$env:GITHUB_WORKSPACE\src-tauri\vcruntime" $dll
              $item = Get-Item $dest
              $vi = $item.VersionInfo
              $major = $vi.FileMajorPart
              $minor = $vi.FileMinorPart
              if (-not ($major -gt 14 -or ($major -eq 14 -and $minor -ge 44))) {
                  throw "$dll version $major.$minor is older than 14.44"
              }
              Write-Host "$dll version $major.$minor size $($item.Length)"
          }

      - name: Build the offline installer
        shell: bash
        run: |
          set -euo pipefail
          (cd ui && pnpm build)
          # beforeBuildCommand is emptied because we just built the UI from the repo root.
          # createUpdaterArtifacts is disabled: this build is unsigned and is not a release asset.
          tauri build --bundles nsis \
            --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify the bundle carries every runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS setup.exe produced" }
          $mb = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "installer: $($setup.FullName) ($mb MB)"
          if ($setup.Length -lt 150MB) { throw "installer is only $mb MB; libmpv and/or WebView2 offline are missing" }

          if (-not (Test-Path src-tauri/libmpv-2.dll)) { throw "libmpv-2.dll was not staged for bundling" }
          foreach ($dll in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll')) {
              if (-not (Test-Path "src-tauri/vcruntime/$dll")) { throw "vcruntime/$dll missing from the bundle" }
          }

          # The generated NSIS script is the proof that both payloads were actually attached.
          $nsi = Get-ChildItem target -Recurse -Filter installer.nsi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsi) {
              $script = Get-Content -Raw $nsi.FullName
              if ($script -notmatch '(?i)libmpv-2\.dll') { throw "installer.nsi does not reference libmpv-2.dll" }
              if ($script -notmatch '(?i)webview2') { throw "installer.nsi does not reference the WebView2 installer" }
              Write-Host "installer.nsi references libmpv-2.dll and WebView2"
          } else {
              Write-Host "::warning::installer.nsi not found; skipping the payload check"
          }

          ./scripts/check-windows-imports.ps1 -Exe target/release/aura-app.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aura-full-offline-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
